<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Organización de las Computadoras</title>
    <link rel="stylesheet" href="organizacion.css">
</head>
</body>
    <main>
        <h2>organizacion de las Computadoras</h2>
        <p>Responde correctamente a la siguientes preguntas:</p>

        
        <div class="pregunta-box">
            <p><strong>1. ¿Cuál es el componente considerado el "cerebro" de la computadora?</strong></p>
            <button onclick="verificarPregunta(false, 'Almacenamiento masivo lento.')">A) Memoria RAM</button>
            <button onclick="verificarPregunta(true, '¡Excelente! La CPU procesa todos los datos.')">B) CPU (Procesador)</button>
        </div>


        <div class="pregunta-box">
            <p><strong>2.</strong></p>
            <button onclick="verificarPregunta(true, '¡Correcto! Es memoria de acceso aleatorio temporal.')">A)</button>
            <button onclick="verificarPregunta(false, 'Incorrecto. El Disco Rígido guarda datos permanentemente.')">B)</button>
        </div>
    </main>
    
    <script>
        function verificarPregunta(esCorrecta, mensaje) {
            if(esCorrecta) {
                alert("¡Felicidades! " + mensaje);
            } else {
                alert("Lo siento, respuesta incorrecta. ¡Vuelve a intentarlo! (" + mensaje + ")");
            }
        }
    </script>
</body>
</html>
