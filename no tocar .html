<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Arena de Combate - Parry</title>
  <style>
    body {
      margin: 0;
      background-color: #12121c;
      color: white;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }
    canvas {
      border: 4px solid #444;
      border-radius: 10px;
      background: linear-gradient(to bottom, #1e2a4a 0%, #3a2e52 70%, #222 70%, #111 100%);
    }
    .controles {
      margin-top: 15px;
      display: flex;
      gap: 12px;
    }
    button {
      padding: 12px 20px;
      font-size: 16px;
      font-weight: bold;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      color: white;
    }
    button:disabled { filter: grayscale(100%); cursor: not-allowed; }
    #btn-atacar { background: #e53935; }
    #btn-especial { background: #fb8c00; }
    #btn-curar { background: #43a047; }
    #btn-parry { background: #00acc1; border: 2px solid #80deea; }
    #btn-reiniciar { background: #1e88e5; display: none; }
  </style>
</head>
<body>

  <canvas id="pantalla" width="800" height="400"></canvas>

  <div class="controles">
    <button id="btn-atacar" onclick="turnoJugador('atacar')">Atacar</button>
    <button id="btn-especial" onclick="turnoJugador('especial')">Especial</button>
    <button id="btn-curar" onclick="turnoJugador('curar')">Curar</button>
    <button id="btn-parry" onclick="intentarParry()">Parry (Espacio)</button>
    <button id="btn-reiniciar" onclick="reiniciarJuego()">Jugar de nuevo</button>
  </div>

  <script src="no tocar .js"></script>
</body>
</html>
